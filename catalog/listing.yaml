    alt:
      en: "Knowledge search playground with the query 「育児休業から復帰するときの手続き」 entered, search mode set to Vector, maximum hits 8, and options to rerank or expand the query with an LLM."
      ja: "Knowledge の検索プレイグラウンド。クエリに「育児休業から復帰するときの手続き」を入力し、検索モードを「ベクトル」、最大ヒット数を 8 にした状態で、LLM による並べ替えとクエリ補完の選択肢があります。"
